name: Clasificacion

on:
  schedule:
    - cron: '0 21 * * 0'   # domingos 21:00 UTC, tras la jornada
    - cron: '0 8 * * 1'    # lunes por la mañana, por si algún partido se aplazó
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  tabla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: pip install requests --quiet

      - name: Actualizar clasificacion.json
        env:
          THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}
        run: |
          python3 << 'PYEOF'
          import json, os, sys, requests
          from datetime import datetime

          LIGA      = "5091"        # Spanish Segunda Federacion Group 4
          TEMPORADA = "2026-2027"
          RUTA      = "clasificacion.json"

          # Nombre en TheSportsDB -> (nombre que mostramos, escudo del sitio)
          EQUIPOS = {
            "atletico antoniano":   ("Antoniano",             "antoniano.png"),
            "atletico central":     ("Atletico Central",      "atletico-central.png"),
            "atletico sanluqueno":  ("Atletico Sanluqueno",   "sanluqueno.png"),
            "badajoz":              ("Badajoz",               "badajoz.png"),
            "betis deportivo":      ("Betis B",               "betis-deportivo.png"),
            "ciudad de lucena":     ("Ciudad de Lucena",      "ciudad-lucena.png"),
            "don benito":           ("Don Benito",            "don-benito.png"),
            "estepona":             ("Estepona",              "estepona.png"),
            "las palmas atletico":  ("Las Palmas Atletico",   "las-palmas-atletico.png"),
            "linares deportivo":    ("Linares Deportivo",     "linares.png"),
            "marbella":             ("Marbella",              "marbella.png"),
            "mijas-las lagunas":    ("Mijas Las Lagunas",     "las-lagunas.png"),
            "mijas las lagunas":    ("Mijas Las Lagunas",     "las-lagunas.png"),
            "puente genil":         ("Salerm Puente Genil",   "puente-genil.png"),
            "recreativo de huelva": ("Recreativo de Huelva",  "recreativo.png"),
            "sevilla atletico":     ("Sevilla Atletico",      "sevilla-atletico.png"),
            "tamaraceite":          ("Tamaraceite",           "tamaraceite.png"),
            "tenerife b":           ("Tenerife B",            "tenerife-b.png"),
            "xerez":                ("Xerez CD",              "escudo-xerez-cd-hd.png"),
            "xerez cd":             ("Xerez CD",              "escudo-xerez-cd-hd.png"),
          }

          # Los nombres que muestra la web llevan tildes; el mapa va sin ellas
          # para que la comparacion sea robusta. Aqui las devolvemos.
          TILDES = {
            "Atletico Central":     "Atl\u00e9tico Central",
            "Atletico Sanluqueno":  "Atl\u00e9tico Sanluque\u00f1o",
            "Las Palmas Atletico":  "Las Palmas Atl\u00e9tico",
            "Sevilla Atletico":     "Sevilla Atl\u00e9tico",
          }

          def sin_tildes(s):
              tabla = str.maketrans("aaaaeeeeiiiioooouuuunc", "aaaaeeeeiiiioooouuuunc")
              reemp = {"\u00e1":"a","\u00e9":"e","\u00ed":"i","\u00f3":"o","\u00fa":"u",
                       "\u00e0":"a","\u00e8":"e","\u00ec":"i","\u00f2":"o","\u00f9":"u",
                       "\u00f1":"n","\u00e7":"c","\u00fc":"u"}
              s = s.lower().strip()
              for k, v in reemp.items():
                  s = s.replace(k, v)
              return s

          key = os.environ.get("THESPORTSDB_KEY", "").strip()
          if not key:
              print("ERROR: THESPORTSDB_KEY no configurada.")
              sys.exit(1)

          url = "https://www.thesportsdb.com/api/v1/json/%s/lookuptable.php" % key
          resp = requests.get(url, params={"l": LIGA, "s": TEMPORADA}, timeout=20)
          try:
              filas = resp.json().get("table") or []
          except Exception as e:
              print("Respuesta ilegible de la API:", e)
              sys.exit(0)

          if len(filas) < 18:
              # La API aun no publica la tabla completa: mejor no tocar el archivo
              # que dejar la clasificacion a medias en la web.
              print("Solo %d equipos en la respuesta; no se toca %s." % (len(filas), RUTA))
              sys.exit(0)

          equipos = []
          for f in filas:
              bruto = f.get("strTeam") or ""
              clave = sin_tildes(bruto)
              nombre, escudo = EQUIPOS.get(clave, (bruto, "escudo-xerez-cd-hd.png"))
              if clave not in EQUIPOS:
                  print("AVISO: equipo sin mapear ->", bruto)
              nombre = TILDES.get(nombre, nombre)
              def num(campo):
                  try:    return int(f.get(campo) or 0)
                  except: return 0
              equipos.append({
                  "nombre": nombre,
                  "escudo": "fotos/escudos/" + escudo,
                  "pj":  num("intPlayed"),
                  "pts": num("intPoints"),
                  "gf":  num("intGoalsFor"),
                  "gc":  num("intGoalsAgainst"),
              })

          jornada = max((e["pj"] for e in equipos), default=0)
          datos = {
              "actualizado": datetime.now().strftime("%Y-%m-%d"),
              "jornada": jornada,
              "fuente": "thesportsdb",
              "equipos": equipos,
          }

          with open(RUTA, "w", encoding="utf-8") as fh:
              json.dump(datos, fh, ensure_ascii=False, indent=2)
          print("clasificacion.json actualizado: %d equipos, jornada %d" % (len(equipos), jornada))
          PYEOF

      - name: Publicar cambios
        run: |
          git config user.name "Diario Xerecista (bot)"
          git config user.email "bot@puroxerecismo.local"
          git add clasificacion.json
          git diff --quiet --cached || git commit -m "Auto: clasificacion"
          git push
