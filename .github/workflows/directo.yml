name: Resultado en directo

on:
  schedule:
    - cron: '*/5 * * * *'   # GitHub no garantiza la frecuencia: puede retrasarlo o saltárselo
    - cron: '17,47 * * * *' # refuerzo fuera de las horas en punto, que es cuando más se retrasa
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # para que un robot pueda lanzar a su relevo

# Un solo robot a la vez: si arranca otro mientras uno vigila un partido, espera su turno.
concurrency:
  group: directo
  cancel-in-progress: false

jobs:
  live-score:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - name: Instalar dependencias
        run: pip install requests requests-oauthlib pillow --quiet

      - name: Configurar git
        run: |
          git config user.name "Diario Xerecista (bot)"
          git config user.email "bot@puroxerecismo.local"

      - name: Vigilar el partido y actualizar live.json
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 << 'PYEOF'
          import json, os, sys, time, subprocess, requests
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          # ── Calendario de partidos (fecha + hora orientativa) ──────────────
          # Actualiza las horas cuando la RFEF confirme los horarios oficiales.
          PARTIDOS = [
            {"fecha":"2026-09-05","hora":"21:00","local":"C.D. Estepona","visitante":"Xerez CD"},
            {"fecha":"2026-09-13","hora":"19:00","local":"Xerez CD","visitante":"C.D. Badajoz"},
            {"fecha":"2026-09-20","hora":"19:00","local":"Xerez CD","visitante":"C.D. Don Benito"},
            {"fecha":"2026-09-27","hora":"17:00","local":"RC Recreativo de Huelva","visitante":"Xerez CD"},
            {"fecha":"2026-10-04","hora":"12:00","local":"Xerez CD","visitante":"C.D. Tenerife \"B\""},
            {"fecha":"2026-10-10","hora":"18:00","local":"Betis Deportivo","visitante":"Xerez CD"},
            {"fecha":"2026-10-18","hora":"19:00","local":"Xerez CD","visitante":"Ciudad de Lucena"},
            {"fecha":"2026-10-25","hora":"19:00","local":"Xerez CD","visitante":"Marbella F.C."},
            {"fecha":"2026-10-29","hora":"21:00","local":"Xerez CD","visitante":"Cádiz CF"},
            {"fecha":"2026-11-01","hora":"13:00","local":"U.D. Tamaraceite","visitante":"Xerez CD"},
            {"fecha":"2026-11-08","hora":"12:30","local":"Atlético Sanluqueño","visitante":"Xerez CD"},
            {"fecha":"2026-11-15","hora":"18:00","local":"Xerez CD","visitante":"C.A. Antoniano"},
            {"fecha":"2026-11-22","hora":"12:00","local":"C. Atlético Central","visitante":"Xerez CD"},
            {"fecha":"2026-11-29","hora":"17:00","local":"Xerez CD","visitante":"Linares Deportivo"},
            {"fecha":"2026-12-06","hora":"17:00","local":"Las Palmas Atlético","visitante":"Xerez CD"},
            {"fecha":"2026-12-13","hora":"17:00","local":"Sevilla Atlético","visitante":"Xerez CD"},
            {"fecha":"2026-12-20","hora":"17:00","local":"Xerez CD","visitante":"C.P. Mijas Las Lagunas"},
            {"fecha":"2027-01-10","hora":"17:00","local":"Salerm Puente Genil","visitante":"Xerez CD"},
            {"fecha":"2027-01-17","hora":"17:00","local":"Xerez CD","visitante":"C.D. Estepona"},
            {"fecha":"2027-01-24","hora":"17:00","local":"Ciudad de Lucena","visitante":"Xerez CD"},
            {"fecha":"2027-01-31","hora":"17:00","local":"Xerez CD","visitante":"Atlético Sanluqueño"},
            {"fecha":"2027-02-07","hora":"17:00","local":"Xerez CD","visitante":"Betis Deportivo"},
            {"fecha":"2027-02-14","hora":"17:00","local":"C.D. Don Benito","visitante":"Xerez CD"},
            {"fecha":"2027-02-21","hora":"17:00","local":"Xerez CD","visitante":"U.D. Tamaraceite"},
            {"fecha":"2027-02-28","hora":"17:00","local":"Marbella F.C.","visitante":"Xerez CD"},
            {"fecha":"2027-03-07","hora":"17:00","local":"Xerez CD","visitante":"Sevilla Atlético"},
            {"fecha":"2027-03-14","hora":"17:00","local":"C.P. Mijas Las Lagunas","visitante":"Xerez CD"},
            {"fecha":"2027-03-21","hora":"17:00","local":"Xerez CD","visitante":"RC Recreativo de Huelva"},
            {"fecha":"2027-03-28","hora":"17:00","local":"C.A. Antoniano","visitante":"Xerez CD"},
            {"fecha":"2027-04-04","hora":"17:00","local":"Xerez CD","visitante":"C. Atlético Central"},
            {"fecha":"2027-04-11","hora":"17:00","local":"C.D. Tenerife \"B\"","visitante":"Xerez CD"},
            {"fecha":"2027-04-18","hora":"17:00","local":"Xerez CD","visitante":"Salerm Puente Genil"},
            {"fecha":"2027-04-25","hora":"17:00","local":"Linares Deportivo","visitante":"Xerez CD"},
            {"fecha":"2027-05-02","hora":"17:00","local":"Xerez CD","visitante":"Las Palmas Atlético"},
            {"fecha":"2027-05-09","hora":"17:00","local":"C.D. Badajoz","visitante":"Xerez CD"},
          ]

          # ── Funcionamiento ─────────────────────────────────────────────────
          # GitHub lanza este workflow cuando puede: de media cada 3,5 horas y a veces con
          # huecos de 10. Por eso, si arranca hasta 18 horas antes del saque, se queda
          # esperando sin gastar nada y, antes de agotar sus 6 horas, lanza a su relevo, de
          # modo que siempre hay un robot en marcha cuando empieza el partido. Desde 10 min
          # antes vigila el partido entero: marcador, minuto y descanso
          # de Futbolme cada 60 s; goleadores de API-Football cada 5 min. Publica cada
          # cambio, al final deja "FINAL" y se detiene; la siguiente ejecución fuera
          # de horario apaga el directo.
          ESPERA_HORAS = 18      # horas antes del saque desde las que un robot se queda esperando
          RELEVO_MIN = 300       # min que aguanta un robot esperando antes de lanzar a su relevo
          LIMITE_MIN = 340       # min de vida útil de un robot (timeout-minutes: 350)
          CONSULTA_ANTES = 10    # min antes del saque en que empieza a consultar la API
          FIN_VENTANA = 135      # min después del saque en que se deja de vigilar
          
          MADRID = ZoneInfo("Europe/Madrid")
          def ahora():
              return datetime.now(MADRID).replace(tzinfo=None)

          LIVE_PATH = "live.json"

          def leer():
              try:
                  return json.load(open(LIVE_PATH, encoding="utf-8"))
              except Exception:
                  return None

          def publicar(data):
              """Escribe live.json y lo sube si ha cambiado."""
              subprocess.run(["git", "pull", "-q", "--rebase", "--autostash"], check=False)
              actual = leer() or {}
              # Goleadores puestos a mano (p. ej. por Claude) que la API aún no tiene: conservarlos
              if data.get("activo") and len(actual.get("goles") or []) > len(data.get("goles") or []):
                  data = {**data, "goles": actual["goles"]}
              if actual == data:
                  return
              with open(LIVE_PATH, "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False)
              print(ahora().strftime("%H:%M:%S"), "live.json →", data, flush=True)
              subprocess.run(["git", "add", LIVE_PATH], check=False)
              if subprocess.run(["git", "diff", "--quiet", "--cached"]).returncode == 0:
                  return
              subprocess.run(["git", "commit", "-q", "-m", "Auto: resultado en directo"], check=False)
              for intento in range(3):
                  subprocess.run(["git", "pull", "-q", "--rebase", "--autostash"], check=False)
                  if subprocess.run(["git", "push", "-q"]).returncode == 0:
                      return
                  time.sleep(5)
              print("AVISO: no se pudo subir live.json", flush=True)

          APAGADO = {"activo": False}

          def saque(p):
              return datetime.strptime(p["fecha"] + " " + p["hora"], "%Y-%m-%d %H:%M")

          INICIO = ahora()
          partido_hoy = next((p for p in PARTIDOS
                              if saque(p) - timedelta(hours=ESPERA_HORAS) <= INICIO <= saque(p) + timedelta(minutes=FIN_VENTANA)), None)
          if not partido_hoy:
              # Fuera de la ventana: apagar el directo y no gastar cuota de la API
              publicar(APAGADO)
              sys.exit(0)

          kick = saque(partido_hoy)
          hoy = partido_hoy["fecha"]
          print("Partido vigilado:", partido_hoy, flush=True)

          def lanzar_relevo():
              r = requests.post(
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/directo.yml/dispatches",
                  headers={"Authorization": "Bearer " + os.environ.get("GH_TOKEN", ""), "Accept": "application/vnd.github+json"},
                  json={"ref": "main"}, timeout=20)
              print("Relevo lanzado:", r.status_code, flush=True)
              return r.status_code == 204

          # Si no llegaría vivo al final del partido, relevo antes del saque
          necesita_relevo = kick + timedelta(minutes=FIN_VENTANA) > INICIO + timedelta(minutes=LIMITE_MIN)
          hora_relevo = min(INICIO + timedelta(minutes=RELEVO_MIN), kick - timedelta(minutes=30))

          # "manual": true en live.json = alguien lo lleva a mano durante el partido: no tocarlo
          if ahora() >= kick - timedelta(minutes=CONSULTA_ANTES) and (leer() or {}).get("manual"):
              print("live.json en modo manual; el robot no lo toca.", flush=True)
              sys.exit(0)

          key = os.environ.get("API_FOOTBALL_KEY", "").strip()
          if not key:
              print("ERROR: API_FOOTBALL_KEY no configurada.")
              sys.exit(1)
          HEADERS = {"x-apisports-key": key}

          def api(params):
              r = requests.get("https://v3.football.api-sports.io/fixtures", params=params, headers=HEADERS, timeout=20)
              return r.json().get("response", [])

          # Hay otros equipos "Xerez" (p. ej. Xerez Deportivo): exigir también alguna palabra del rival del día
          import unicodedata
          def normal(t):
              return "".join(c for c in unicodedata.normalize("NFD", t.lower()) if unicodedata.category(c) != "Mn").replace(".", " ").replace('"', " ")
          rival = partido_hoy["visitante"] if "xerez" in partido_hoy["local"].lower() else partido_hoy["local"]
          claves_rival = [w for w in normal(rival).split() if len(w) >= 4 and w not in ("club", "atletico", "deportivo")]

          def es_xerez(f):
              nombres = normal(f["teams"]["home"]["name"] + " " + f["teams"]["away"]["name"])
              return "xerez" in nombres and any(w in nombres for w in claves_rival)

          # ── Futbolme: marcador, minuto y estado (va al minuto en Segunda RFEF; su robots.txt lo permite)
          import re, html as htmlmod
          UA = {"User-Agent": "DiarioXerecista-directo/1.0 (+https://www.diarioxerecista.es)"}

          def url_futbolme():
              """Busca en la portada de Futbolme el partido de hoy del Xerez CD (no el Xerez Deportivo)."""
              # Primero la página del Grupo IV (trae la jornada entera); la portada, para la Copa
              for pagina in ("https://www.futbolme.com/resultados-directo/torneo/segunda-federacion-grupo-4/3060/",
                             "https://www.futbolme.com/"):
                  s = requests.get(pagina, headers=UA, timeout=30).text
                  for m in re.finditer(r'/resultados-directo/partido/([a-z0-9-]+)/(\d+)', s):
                      slug = m.group(1)
                      if "xerez-cd" in slug and any(w in slug for w in claves_rival):
                          return "https://www.futbolme.com" + m.group(0)
              return None

          def leer_futbolme(url):
              """Devuelve (marcador o None, estado): estado p. ej. '1T - Minuto 23', 'Descanso', '' al acabar."""
              s = requests.get(url, headers=UA, timeout=30).text
              t = re.sub(r"<script.*?</script>|<style.*?</style>", "", s, flags=re.S)
              partes = [p.strip() for p in htmlmod.unescape(re.sub(r"<[^>]+>", "|", t)).split("|") if p.strip()]
              i = next((k for k, p in enumerate(partes) if p.startswith("Actualizado a las")), None)
              if i is None:
                  return None
              estado = partes[i + 1] if re.search(r"(?i)minuto|descanso|final|aplaz|suspend", partes[i + 1]) else ""
              j = i + 1 + (1 if estado else 0)
              g1, g2 = partes[j + 2], partes[j + 3]
              return (f"{g1}-{g2}" if g1.isdigit() and g2.isdigit() else None), estado

          # ── API-Football: solo para los goleadores (en esta categoría a veces se congela)
          def goleadores_api(fixture_id):
              res = api({"id": fixture_id})
              if not res:
                  return []
              f, lista = res[0], []
              for ev in f.get("events") or []:
                  if ev.get("type") != "Goal" or ev.get("detail") == "Missed Penalty":
                      continue
                  lado = "local" if ev["team"]["id"] == f["teams"]["home"]["id"] else "visitante"
                  t = ev.get("time") or {}
                  lista.append({"equipo": lado, "jugador": (ev.get("player") or {}).get("name") or "",
                                "minuto": f"{t.get('elapsed')}" + (f"+{t['extra']}" if t.get("extra") else ""),
                                "tipo": {"Own Goal": "pp", "Penalty": "pen"}.get(ev.get("detail"), "")})
              return lista

          base = {"local": partido_hoy["local"], "visitante": partido_hoy["visitante"]}
          url_fm, fixture_id, goles_lista = None, None, []
          ultima_api, visto_2t, ultimo_min, vacios = 0, False, 0, 0
          # Reloj propio: Futbolme a veces da minutos absurdos (8/11/2026: 31' al minuto de empezar,
          # saltos al 86'-99' en la 2.ª parte) y se congela sin poner "Final" (se quedó en el 71').
          descanso_visto, inicio_2t, final_publicado = None, None, False
          ultimo_crudo, ultimo_cambio = None, ahora()
          TOLERANCIA_MIN = 7     # si el minuto de Futbolme se aleja más del reloj propio, manda el propio
          FINAL_TRAS = 110       # min desde el saque a partir de los que un Futbolme quieto = final
          QUIETO_MIN = 8         # min sin ningún cambio en Futbolme para darlo por terminado

          def minuto_propio():
              t = ahora()
              if inicio_2t and t >= inicio_2t:
                  return min(95, 46 + int((t - inicio_2t).total_seconds() // 60))
              if descanso_visto:
                  return None
              if t >= kick + timedelta(minutes=62):   # Futbolme no avisó del descanso: 2.ª parte estimada
                  return min(95, 46 + int((t - kick - timedelta(minutes=62)).total_seconds() // 60))
              return max(1, min(45, 1 + int((t - kick).total_seconds() // 60)))
          PAUSA_FM = 60          # s entre lecturas de Futbolme
          PAUSA_API = 300        # s entre consultas de goleadores (~25 por partido)

          while ahora() <= kick + timedelta(minutes=FIN_VENTANA):
              if ahora() < kick - timedelta(minutes=CONSULTA_ANTES):
                  subprocess.run(["git", "pull", "-q", "--rebase", "--autostash"], check=False)
                  if not (leer() or {}).get("manual"):
                      publicar(APAGADO)
                  if necesita_relevo and ahora() >= hora_relevo and lanzar_relevo():
                      sys.exit(0)
                  time.sleep(60)
                  continue
              if (leer() or {}).get("manual"):
                  print("live.json pasado a modo manual; el robot se retira.", flush=True)
                  break
              try:
                  if url_fm is None:
                      url_fm = url_futbolme()
                      print("Futbolme:", url_fm, flush=True)
                  if fixture_id is None or time.time() - ultima_api >= PAUSA_API:
                      ultima_api = time.time()
                      if fixture_id is None:
                          p = next((f for f in api({"date": hoy}) if es_xerez(f)), None)
                          fixture_id = p["fixture"]["id"] if p else None
                      if fixture_id:
                          goles_lista = goleadores_api(fixture_id) or goles_lista
              except Exception as e:
                  print("Error buscando el partido / goleadores:", e, flush=True)
              r = None
              try:
                  r = leer_futbolme(url_fm) if url_fm else None
              except Exception as e:
                  print("Error leyendo Futbolme:", e, flush=True)
              if not r:
                  time.sleep(PAUSA_FM)
                  continue
              marcador, estado = r
              if (marcador, estado) != ultimo_crudo:
                  ultimo_crudo, ultimo_cambio = (marcador, estado), ahora()
              actual = leer() or {}
              marcador = marcador or actual.get("resultado") or "0-0"
              extra = {"goles": goles_lista} if goles_lista else {}
              m = re.search(r"Minuto\s*(\d+)", estado)
              if re.search(r"(?i)descanso", estado) and not descanso_visto:
                  descanso_visto = ahora()
              if estado.startswith("2T") or (m and descanso_visto and not re.search(r"(?i)descanso", estado)):
                  visto_2t = True
                  if inicio_2t is None:
                      # La reanudación que marca Futbolme sí es fiable (8/11: 2T a las 13:41, gol al 52' a las 13:47)
                      inicio_2t = ahora()
              minuto_fm = int(m.group(1)) if m else None
              propio = minuto_propio()
              if minuto_fm is not None and propio is not None and abs(minuto_fm - propio) > TOLERANCIA_MIN:
                  minuto = propio
              else:
                  minuto = minuto_fm
              if minuto is not None:
                  ultimo_min = minuto
              vacios = 0 if estado else vacios + 1
              if re.search(r"(?i)aplaz|suspend", estado):
                  publicar(APAGADO)
                  break
              # Al acabar, Futbolme deja el estado en blanco: exigirlo dos veces seguidas y pasado el 85'
              quieto = (ahora() - kick >= timedelta(minutes=FINAL_TRAS)
                        and ahora() - ultimo_cambio >= timedelta(minutes=QUIETO_MIN))
              if re.search(r"(?i)final", estado) or (vacios >= 2 and visto_2t and ultimo_min >= 85) or quieto:
                  publicar({"activo": True, **base, "resultado": marcador, "minuto": "", "estado": "FINAL", **extra})
                  final_publicado = True
                  break
              if re.search(r"(?i)descanso", estado):
                  publicar({"activo": True, **base, "resultado": marcador, "minuto": "", "estado": "DESCANSO", **extra})
              elif minuto is not None:
                  publicar({"activo": True, **base, "resultado": marcador, "minuto": minuto, **extra})
              # sin estado y sin haber visto la 2.ª parte = aún no ha empezado: no tocar nada
              time.sleep(PAUSA_FM)

          # Se acabó la ventana sin "Final" (Futbolme congelado): cerrar con el último marcador
          if not final_publicado:
              actual = leer() or {}
              if actual.get("activo") and not actual.get("manual") and actual.get("estado") != "FINAL":
                  publicar({**actual, "minuto": "", "estado": "FINAL"})

          PYEOF

      - name: Publicar el resultado final en X
        # Desactivado el 30/10/2026 a petición del usuario (X pide créditos de pago). Para reactivarlo: if: always()
        if: false
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          git pull -q --rebase --autostash || true
          python3 scripts/publicar_x.py || fallo=1
          if [ -n "$(git status --porcelain publicados-x.json)" ]; then
            git add publicados-x.json
            git commit -q -m "Auto: resultado publicado en X"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          fi
          exit ${fallo:-0}
