name: Resultado en directo

on:
  schedule:
    - cron: '*/5 * * * *'   # GitHub no garantiza la frecuencia: puede retrasarlo o saltárselo
  workflow_dispatch: {}

permissions:
  contents: write

# Un solo robot a la vez: si arranca otro mientras uno vigila un partido, espera su turno.
concurrency:
  group: directo
  cancel-in-progress: false

jobs:
  live-score:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - name: Instalar dependencias
        run: pip install requests requests-oauthlib pillow --quiet

      - name: Configurar git
        run: |
          git config user.name "Diario Xerecista (bot)"
          git config user.email "bot@puroxerecismo.local"

      - name: Vigilar el partido y actualizar live.json
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python3 << 'PYEOF'
          import json, os, sys, time, subprocess, requests
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          # ── Calendario de partidos (fecha + hora orientativa) ──────────────
          # Actualiza las horas cuando la RFEF confirme los horarios oficiales.
          PARTIDOS = [
            {"fecha":"2026-09-05","hora":"21:00","local":"C.D. Estepona","visitante":"Xerez CD"},
            {"fecha":"2026-09-13","hora":"19:00","local":"Xerez CD","visitante":"C.D. Badajoz"},
            {"fecha":"2026-09-20","hora":"19:00","local":"Xerez CD","visitante":"C.D. Don Benito"},
            {"fecha":"2026-09-27","hora":"17:00","local":"RC Recreativo de Huelva","visitante":"Xerez CD"},
            {"fecha":"2026-10-04","hora":"12:00","local":"Xerez CD","visitante":"C.D. Tenerife \"B\""},
            {"fecha":"2026-10-10","hora":"18:00","local":"Betis Deportivo","visitante":"Xerez CD"},
            {"fecha":"2026-10-18","hora":"19:00","local":"Xerez CD","visitante":"Ciudad de Lucena"},
            {"fecha":"2026-10-25","hora":"19:00","local":"Xerez CD","visitante":"Marbella F.C."},
            {"fecha":"2026-11-01","hora":"13:00","local":"U.D. Tamaraceite","visitante":"Xerez CD"},
            {"fecha":"2026-11-08","hora":"12:30","local":"Atlético Sanluqueño","visitante":"Xerez CD"},
            {"fecha":"2026-11-15","hora":"17:00","local":"Xerez CD","visitante":"C.A. Antoniano"},
            {"fecha":"2026-11-22","hora":"17:00","local":"C. Atlético Central","visitante":"Xerez CD"},
            {"fecha":"2026-11-29","hora":"17:00","local":"Xerez CD","visitante":"Linares Deportivo"},
            {"fecha":"2026-12-06","hora":"17:00","local":"Las Palmas Atlético","visitante":"Xerez CD"},
            {"fecha":"2026-12-13","hora":"17:00","local":"Sevilla Atlético","visitante":"Xerez CD"},
            {"fecha":"2026-12-20","hora":"17:00","local":"Xerez CD","visitante":"C.P. Mijas Las Lagunas"},
            {"fecha":"2027-01-10","hora":"17:00","local":"Salerm Puente Genil","visitante":"Xerez CD"},
            {"fecha":"2027-01-17","hora":"17:00","local":"Xerez CD","visitante":"C.D. Estepona"},
            {"fecha":"2027-01-24","hora":"17:00","local":"Ciudad de Lucena","visitante":"Xerez CD"},
            {"fecha":"2027-01-31","hora":"17:00","local":"Xerez CD","visitante":"Atlético Sanluqueño"},
            {"fecha":"2027-02-07","hora":"17:00","local":"Xerez CD","visitante":"Betis Deportivo"},
            {"fecha":"2027-02-14","hora":"17:00","local":"C.D. Don Benito","visitante":"Xerez CD"},
            {"fecha":"2027-02-21","hora":"17:00","local":"Xerez CD","visitante":"U.D. Tamaraceite"},
            {"fecha":"2027-02-28","hora":"17:00","local":"Marbella F.C.","visitante":"Xerez CD"},
            {"fecha":"2027-03-07","hora":"17:00","local":"Xerez CD","visitante":"Sevilla Atlético"},
            {"fecha":"2027-03-14","hora":"17:00","local":"C.P. Mijas Las Lagunas","visitante":"Xerez CD"},
            {"fecha":"2027-03-21","hora":"17:00","local":"Xerez CD","visitante":"RC Recreativo de Huelva"},
            {"fecha":"2027-03-28","hora":"17:00","local":"C.A. Antoniano","visitante":"Xerez CD"},
            {"fecha":"2027-04-04","hora":"17:00","local":"Xerez CD","visitante":"C. Atlético Central"},
            {"fecha":"2027-04-11","hora":"17:00","local":"C.D. Tenerife \"B\"","visitante":"Xerez CD"},
            {"fecha":"2027-04-18","hora":"17:00","local":"Xerez CD","visitante":"Salerm Puente Genil"},
            {"fecha":"2027-04-25","hora":"17:00","local":"Linares Deportivo","visitante":"Xerez CD"},
            {"fecha":"2027-05-02","hora":"17:00","local":"Xerez CD","visitante":"Las Palmas Atlético"},
            {"fecha":"2027-05-09","hora":"17:00","local":"C.D. Badajoz","visitante":"Xerez CD"},
          ]

          # ── Funcionamiento ─────────────────────────────────────────────────
          # GitHub lanza este workflow cuando puede (a veces con mucho retraso).
          # Por eso, si arranca hasta 90 min antes del saque, se queda esperando y,
          # desde 10 min antes, vigila el partido entero consultando la API cada
          # 150 s y publicando cada cambio. Al final deja "FINAL" y se detiene;
          # la siguiente ejecución fuera de horario apaga el directo.
          ESPERA_ANTES = 90      # min antes del saque en que ya merece la pena quedarse
          CONSULTA_ANTES = 10    # min antes del saque en que empieza a consultar la API
          FIN_VENTANA = 135      # min después del saque en que se deja de vigilar
          PAUSA = 150            # s entre consultas (~60 consultas por partido)

          MADRID = ZoneInfo("Europe/Madrid")
          def ahora():
              return datetime.now(MADRID).replace(tzinfo=None)

          LIVE_PATH = "live.json"

          def leer():
              try:
                  return json.load(open(LIVE_PATH, encoding="utf-8"))
              except Exception:
                  return None

          def publicar(data):
              """Escribe live.json y lo sube si ha cambiado."""
              if leer() == data:
                  return
              with open(LIVE_PATH, "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False)
              print(ahora().strftime("%H:%M:%S"), "live.json →", data, flush=True)
              subprocess.run(["git", "add", LIVE_PATH], check=False)
              if subprocess.run(["git", "diff", "--quiet", "--cached"]).returncode == 0:
                  return
              subprocess.run(["git", "commit", "-q", "-m", "Auto: resultado en directo"], check=False)
              for intento in range(3):
                  subprocess.run(["git", "pull", "-q", "--rebase", "--autostash"], check=False)
                  if subprocess.run(["git", "push", "-q"]).returncode == 0:
                      return
                  time.sleep(5)
              print("AVISO: no se pudo subir live.json", flush=True)

          APAGADO = {"activo": False}

          hoy = ahora().strftime("%Y-%m-%d")
          partido_hoy = next((p for p in PARTIDOS if p["fecha"] == hoy), None)
          if not partido_hoy:
              publicar(APAGADO)
              sys.exit(0)

          h, m = map(int, partido_hoy["hora"].split(":"))
          kick = ahora().replace(hour=h, minute=m, second=0, microsecond=0)
          if not (kick - timedelta(minutes=ESPERA_ANTES) <= ahora() <= kick + timedelta(minutes=FIN_VENTANA)):
              # Fuera de la ventana: apagar el directo y no gastar cuota de la API
              publicar(APAGADO)
              sys.exit(0)

          key = os.environ.get("API_FOOTBALL_KEY", "").strip()
          if not key:
              print("ERROR: API_FOOTBALL_KEY no configurada.")
              sys.exit(1)
          HEADERS = {"x-apisports-key": key}

          def api(params):
              r = requests.get("https://v3.football.api-sports.io/fixtures", params=params, headers=HEADERS, timeout=20)
              return r.json().get("response", [])

          def es_xerez(f):
              return "xerez" in f["teams"]["home"]["name"].lower() or "xerez" in f["teams"]["away"]["name"].lower()

          VIVO      = {"1H", "2H", "ET", "BT", "P", "LIVE"}
          DESCANSO  = {"HT"}
          TERMINADO = {"FT", "AET", "PEN"}
          ANULADO   = {"PST", "CANC", "ABD", "SUSP", "INT", "AWD", "WO"}

          fixture_id = None
          base = {"local": partido_hoy["local"], "visitante": partido_hoy["visitante"]}

          while ahora() <= kick + timedelta(minutes=FIN_VENTANA):
              # Antes de tiempo: esperar sin consultar la API
              if ahora() < kick - timedelta(minutes=CONSULTA_ANTES):
                  publicar(APAGADO)
                  time.sleep(60)
                  continue
              try:
                  if fixture_id is None:
                      partido = next((f for f in api({"date": hoy}) if es_xerez(f)), None)
                      if not partido:
                          print("Partido no encontrado en la API; reintento en 5 min.", flush=True)
                          time.sleep(300)
                          continue
                      fixture_id = partido["fixture"]["id"]
                  res = api({"id": fixture_id})
                  if not res:
                      time.sleep(PAUSA)
                      continue
                  f = res[0]
                  status = f["fixture"]["status"]["short"]
                  goles  = f["goals"]
                  marcador = f"{goles['home'] or 0}-{goles['away'] or 0}"
                  minuto = f["fixture"]["status"].get("elapsed") or ""
                  if status in VIVO:
                      publicar({"activo": True, **base, "resultado": marcador, "minuto": minuto})
                  elif status in DESCANSO:
                      publicar({"activo": True, **base, "resultado": marcador, "minuto": "", "estado": "DESCANSO"})
                  elif status in TERMINADO:
                      publicar({"activo": True, **base, "resultado": marcador, "minuto": "", "estado": "FINAL"})
                      break
                  elif status in ANULADO:
                      publicar(APAGADO)
                      break
                  else:
                      publicar(APAGADO)   # aún no ha empezado
              except Exception as e:
                  print("Error consultando la API:", e, flush=True)
              time.sleep(PAUSA)

          PYEOF

      - name: Publicar el resultado final en X
        if: always()
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          git pull -q --rebase --autostash || true
          python3 scripts/publicar_x.py || fallo=1
          if [ -n "$(git status --porcelain publicados-x.json)" ]; then
            git add publicados-x.json
            git commit -q -m "Auto: resultado publicado en X"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          fi
          exit ${fallo:-0}
